name: Repo radar (weekly)

on:
  schedule:
    # Sundays 11:00 UTC = 08:00 AR (-03:00). Runs before the weekly-ideas job
    # (13:00 UTC) so the radar is fresh when Claude curates the week's ideas.
    - cron: "0 11 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — fetch but don't write/commit"
        type: boolean
        required: false
        default: false

jobs:
  radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Run repo radar
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          # The Actions-provided token raises the GitHub API rate limit for enrichment.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          node scripts/repo-radar.mjs $DRY_FLAG

      - name: Commit report
        if: github.event.inputs.dry_run != 'true'
        run: |
          if [ -z "$(git status --porcelain intel/radar)" ]; then
            echo "No new radar report to commit."
            exit 0
          fi
          git config user.name "codex-engine[bot]"
          git config user.email "codex-engine@users.noreply.github.com"
          git add intel/radar
          git commit -m "radar: weekly $(date -u +%Y-%m-%d)"
          git push
