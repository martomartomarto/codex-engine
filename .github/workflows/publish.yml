name: Publish to LinkedIn (on approval)

# Triggered ONLY on demand — by the Vercel /api/publish endpoint (when you click
# "Publicar ahora" in the confirm page) or manually. There is no schedule here:
# the old daily auto-publish was removed so nothing ships without your approval.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Post date (YYYY-MM-DD). Empty = today."
        required: false
        default: ""
      dry_run:
        description: "Dry run — print but don't post"
        type: boolean
        required: false
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to commit status:sent back (idempotency guard)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Publish today's post
        env:
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_USER_URN: ${{ secrets.LINKEDIN_USER_URN }}
        run: |
          DATE_FLAG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_FLAG="--date ${{ github.event.inputs.date }}"
          fi
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          npx tsx scripts/post.ts $DATE_FLAG $DRY_FLAG

      - name: Mark post as sent (prevents double-publish)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if ! git diff --quiet -- posts/; then
            git config user.name "codex-engine[bot]"
            git config user.email "codex-engine@users.noreply.github.com"
            git add posts/
            git commit -m "post: mark sent [skip ci]"
            git push
          fi
